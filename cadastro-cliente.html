<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>Cadastro de Cliente</title></head>
<body>
  <img src="midias/logo.mercado.png" alt="Logo" width="180">
<h1>Cadastro de Clientes</h1>
<hr>
<nav>
  <a href="index.html">Início</a> 
<br><br>
<form action="#" method="get">
  <p><label for="nome">Nome completo:</label><br><input type="text" id="nome" name="nome" required></p>
  <p><label for="telefone">Telefone / WhatsApp:</label><br><input type="tel" id="telefone" name="telefone" placeholder="(47) 99999-9999" required></p>
  <p><label for="email">E-mail:</label><br><input type="email" id="email" name="email"></p>
  <p><label for="nascimento">Data de nascimento:</label><br><input type="date" id="nascimento" name="nascimento"></p>
  <p><label for="datahora">Data e hora do cadastro:</label><br><input type="datetime-local" id="datahora" name="datahora"></p>
  <p><input type="checkbox" id="ofertas" name="ofertas"><label for="ofertas">Aceito receber ofertas e novidades</label></p>
  <p><label for="observacoes">Observações:</label><br><textarea id="observacoes" name="observacoes" rows="5" cols="40"></textarea></p>
  <p><button type="submit">Enviar cadastro</button> <button type="reset">Limpar formulário</button></p>
</form>
</body></html>
